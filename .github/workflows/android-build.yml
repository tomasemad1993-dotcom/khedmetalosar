name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          echo "Using: $ZIP_FILE"
          mkdir buildsrc
          unzip -q "$ZIP_FILE" -d buildsrc

      - name: Build debug APK
        run: |
          gradle -p buildsrc :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhedmetAlosar-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
