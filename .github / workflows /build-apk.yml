name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KhedmetAlosar_Android_خدمة_الأسرة_بالأيقونة (1).zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q "KhedmetAlosar_Android_خدمة_الأسرة_بالأيقونة (1).zip" -d project

          DIR=$(find project -name settings.gradle -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhedmetAlosar-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
