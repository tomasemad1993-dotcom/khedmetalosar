name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "KhedmetAlosar_Android_APK_Builder.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir buildsrc
          unzip -q KhedmetAlosar_Android_APK_Builder.zip -d buildsrc

          if [ -f buildsrc/settings.gradle ]; then
            echo "PROJECT_DIR=buildsrc" >> $GITHUB_ENV
          else
            DIR=$(find buildsrc -name settings.gradle -type f -print -quit | xargs dirname)
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhedmetAlosar-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
